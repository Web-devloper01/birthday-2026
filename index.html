<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffdde1" />
    <title>A little birthday book for Khushi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Dancing+Script:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="petals" id="petals" aria-hidden="true"></div>

    <section class="scene envelope-scene" id="envelopeScene">
      <header class="intro">
        <p class="eyebrow">A birthday card for</p>
        <h1 id="recipientName">Khushi</h1>
        <p class="from italic">your best friend, Meet</p>
      </header>

      <div class="envelope-stage">
        <div class="envelope" id="envelope">
          <div class="book-slot" aria-hidden="true">
            <div class="book-peek" id="bookPeek">
              <div class="mini-cover">
                <span>Happy Birthday</span>
                <strong id="peekName">Khushi</strong>
              </div>
            </div>
          </div>
          <div class="envelope-body"></div>
          <div class="envelope-pocket" aria-hidden="true"></div>
          <div class="envelope-caption">
            <p>A little birthday note</p>
            <span id="envelopeToName">Especially for Khushi</span>
          </div>
          <div class="flap" id="flap">
            <div class="flap-front">
              <div class="flap-ornament">— + —</div>
              <p class="flap-title">a little birthday magic</p>
            </div>
            <div class="flap-back"></div>
          </div>
          <button
            class="seal"
            id="seal"
            type="button"
            aria-label="Press the seal to open"
          >
            <span class="seal-ring"></span>
            <span class="seal-face">
              <span class="seal-letter" id="sealLetter">K</span>
            </span>
          </button>
        </div>
      </div>
      <p class="hint" id="sealHint">— Press the seal to open —</p>
    </section>

    <section class="scene book-scene" id="bookScene" hidden>
      <div class="book-wrap">
        <article class="book" id="book">
          <div class="spiral-binding" id="spiralBinding" aria-hidden="true"></div>
          <div class="book-edge"></div>
          <div class="pages" id="pages"></div>
        </article>
        <div class="book-nav" role="group" aria-label="Diary navigation">
          <button
            class="nav-btn"
            id="prevBtn"
            type="button"
            aria-label="Previous page"
          >
            <span class="nav-arrow" aria-hidden="true">↑</span>
            <span>Previous</span>
          </button>
          <span class="page-count" id="pageCount" aria-live="polite"></span>
          <div class="dots" id="dots"></div>
          <button
            class="nav-btn"
            id="nextBtn"
            type="button"
            aria-label="Next page"
          >
            <span>Next</span>
            <span class="nav-arrow" aria-hidden="true">↓</span>
          </button>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
